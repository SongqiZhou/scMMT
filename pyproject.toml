[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scMMT"
version = "1.1.0"
description = "Multi-task learning for cell annotation, protein prediction, and single-cell embedding"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
authors = [
  {name = "Songqi Zhou", email = "zhousongqi21@gmail.com"},
]
keywords = ["single-cell", "scRNA-seq", "CITE-seq", "multi-task-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata>=0.9.1",
  "numpy>=1.24.3",
  "pandas>=2.0.1",
  "scanpy>=1.9.3",
  "scikit-learn>=1.2.2",
  "scipy>=1.10.1",
  "torch>=2.0.0",
]

[project.optional-dependencies]
intel = ["scikit-learn-intelex>=2023.1.1"]
test = ["pytest>=8", "ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/SongqiZhou/scMMT"
Paper = "https://doi.org/10.1093/bib/bbad523"
Issues = "https://github.com/SongqiZhou/scMMT/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
